
name: Maven Calculator CI

# Trigger workflow on push and pull requests
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build Maven project
      - name: Build with Maven
        run: mvn clean compile

      # Step 4: Run JUnit test cases
      - name: Run Maven Tests
        run: mvn test

      # Step 5: Package the project
      - name: Package Maven Project
        run: mvn package
